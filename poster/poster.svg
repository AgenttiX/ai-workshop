<?xml version="1.0" encoding="UTF-8"?>
<!-- A3 poster of the Kumpula AI workshop for scientists, dark theme. Units: mm.
     Printed on an office printer: no bleed, content at least 7 mm from the edges. -->
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 297 420">
  <defs>
    <radialGradient id="glow" cx="50%" cy="26%" r="62%">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset="1" stop-color="#141311"/>
    </radialGradient>
    <!-- SVG 1.1 primitives instead of feDropShadow, which Inkscape 1.2 does not render -->
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2.5" result="blurred"/>
      <feFlood flood-color="#000" flood-opacity="0.6"/>
      <feComposite in2="blurred" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect id="background" width="297" height="420" fill="url(#glow)"/>

  <!-- Eye-catching part: the title, the prompt and the cover line -->
  <g id="masthead" fill="#ffffff" text-anchor="middle">
    <text id="masthead-title" x="148.5" y="40" font-family="Inter Display" font-weight="900" font-size="41" letter-spacing="-1">AI WORKSHOP</text>
    <text id="masthead-sub" x="148.5" y="60" font-family="EB Garamond" font-style="italic" font-size="20">for scientists</text>
  </g>

  <g id="prompt" filter="url(#shadow)">
    <rect id="prompt-box" x="7" y="70" width="283" height="72" rx="12" fill="#ffffff"/>
  </g>
  <g id="prompt-content">
    <text id="prompt-text" x="22" y="100" font-family="Inter" font-size="19" fill="#1f1e1d">Can you do my research?</text>
    <rect id="prompt-cursor" x="255" y="83" width="1.6" height="21" fill="#d9663f"/>
    <path id="plus" d="M25 122v10M20 127h10" stroke="#1f1e1d" stroke-width="0.9" stroke-linecap="round"/>
    <text id="model-picker" x="259" y="129" text-anchor="end" font-family="Inter" font-size="5.2" fill="#73726c">Opus 5.5</text>
    <path d="M261 126.3l1.6 1.6 1.6-1.6" fill="none" stroke="#73726c" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect id="send-button" x="270" y="120" width="14" height="14" rx="3.5" fill="#d9663f"/>
    <path d="M277 131v-8M273.8 126.2l3.2-3.2 3.2 3.2" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text id="cover-line" x="148.5" y="166" text-anchor="middle" font-family="EB Garamond" font-size="22" fill="#ffffff">It’s not a chatbot anymore.</text>

  <!-- Information -->
  <rect x="7" y="180" width="283" height="0.5" fill="#6a625a"/>

  <g id="when-where" font-family="Inter" fill="#ffffff">
    <text id="date" x="7" y="199" font-weight="800" font-size="13">Friday 30 October 2026</text>
    <text id="time-place" x="7" y="212" font-weight="600" font-size="7.5">12:00–16:30 · Physicum E207, Kumpula campus</text>
  </g>

  <!-- QR code of the E-lomake sign-up form (figures/qrcode.png) -->
  <g id="qr" font-family="Inter" text-anchor="middle">
    <rect id="qr-bg" x="232" y="186" width="58" height="58" rx="2" fill="#ffffff"/>
    <image id="qr-code" x="234" y="188" width="54" height="54" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" href="data:image/png;base64,"/>
    <text x="261" y="253" font-weight="700" font-size="6" fill="#ffffff">Scan to sign up</text>
    <text x="261" y="261" font-weight="700" font-size="5" fill="#ff7a4d">by Tuesday 27 October</text>
  </g>

  <g id="programme" font-family="Inter" font-size="6" fill="#ffffff">
    <text x="7" y="228" font-weight="700" font-size="5.4" letter-spacing="0.6" fill="#ff7a4d">PROGRAMME</text>
    <text x="7" y="238" font-weight="700">12:00</text>
    <text x="27" y="238"><tspan font-weight="700">Basic use:</tspan> AI in 2026, introduction to agents.</text>
    <text x="27" y="247">•</text>
    <text x="33" y="247">Live demos and hands-on exercises, also with your</text>
    <text x="33" y="255">own research problems.</text>
    <text x="7" y="268" font-weight="700">14:00</text>
    <text x="27" y="268">Coffee break</text>
    <text x="7" y="281" font-weight="700">14:30</text>
    <text x="27" y="281"><tspan font-weight="700">Advanced features:</tspan> agentic skills, hooks, subagents and task delegation,</text>
    <text x="27" y="289">MCP servers, linting, continuous integration.</text>
    <text x="27" y="298">•</text>
    <text x="33" y="298">Showcases: continuous research projects, supercomputer use, running local models.</text>
  </g>

  <g id="good-to-know" font-family="Inter" font-size="6" fill="#ffffff">
    <text x="7" y="318" font-weight="700" font-size="5.4" letter-spacing="0.6" fill="#ff7a4d">GOOD TO KNOW</text>
    <text x="7" y="329">No experience needed: every term is explained. Plenty for advanced users too!</text>
    <text x="7" y="338">In English, for researchers and students of the Faculty of Science.</text>
    <text x="7" y="347">Bring your laptop: after signing up, you'll get a step-by-step setup guide.</text>
  </g>

  <text id="signup-url" x="7" y="367" font-family="Inter" font-weight="600" font-size="6.6" fill="#ffffff"><tspan font-weight="800" fill="#ff7a4d">Sign up:</tspan> elomake.helsinki.fi/lomakkeet/141638/lomake.html</text>

  <g id="footer" font-family="Inter" font-size="5.4" fill="#ffffff">
    <rect x="7" y="373" width="283" height="0.5" fill="#6a625a"/>
    <text x="7" y="381.5" font-weight="700" font-size="5" letter-spacing="0.6" fill="#ff7a4d">ORGANISERS</text>
    <text x="7" y="389">Aaron Haarti, Antti Hippeläinen &amp; Mika Mäki</text>
    <text x="7" y="396">Doctoral researchers</text>
    <text x="7" y="403">Joonas Nättilä, Associate Professor</text>
    <text x="7" y="410">University of Helsinki · Faculty of Science</text>
    <g text-anchor="end">
      <text x="290" y="381.5" font-weight="700" font-size="5" letter-spacing="0.6" fill="#ff7a4d">CONTACT</text>
      <text x="290" y="389">aaron.haarti@helsinki.fi</text>
      <text x="290" y="396">antti.hippelainen@helsinki.fi</text>
      <text x="290" y="403">mika.x.maki@helsinki.fi</text>
      <text x="290" y="410">joonas.nattila@helsinki.fi</text>
    </g>
  </g>
</svg>
