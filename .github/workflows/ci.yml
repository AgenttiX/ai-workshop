name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the one that the macOS and Windows setup scripts install
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            figures/requirements.txt
      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r figures/requirements.txt
      - name: Environment check
        run: python -m workshop.check
      - name: Check that the README has the current setup scripts
        run: python setup/sync_readme.py --check
      - name: Lint
        run: ruff check
      - name: Type check
        run: pyrefly check
      - name: Test
        run: pytest
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
