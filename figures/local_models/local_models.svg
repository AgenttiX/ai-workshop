<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Inter, 'Source Sans Pro', 'Source Sans 3', Helvetica, Arial, sans-serif">
<title>Claude Code with a local model: Claude Code sends the conversation over HTTP to a model server on the same computer, where a chat template turns it into one string, llama.cpp computes the next tokens from the weights, and the reply comes back as text or a tool call that Claude Code runs</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/></marker></defs>
<rect width="1600" height="800" fill="#ffffff"/>
<rect x="30" y="30" width="1540" height="560" rx="16" fill="#f4f5f7" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="52" y="66" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Your computer</text>
<rect x="60" y="100" width="230" height="110" rx="16" fill="#fdf3ea" stroke="#e0a36f" stroke-width="2"/>
<circle cx="94" cy="123" r="7" fill="#e0a36f"/><path d="M81,145 a13,11 0 0 1 26,0 z" fill="#e0a36f"/>
<text x="122" y="134" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">You</text>
<text x="78" y="167" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">type a task</text>
<path d="M290,155 L360,155" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="360" y="90" width="440" height="200" rx="16" fill="#eef4fb" stroke="#7b9cc4" stroke-width="2"/>
<g fill="#d97757" shape-rendering="crispEdges"><rect x="381.2" y="106" width="3.2" height="3.2"/><rect x="384.4" y="106" width="3.2" height="3.2"/><rect x="387.6" y="106" width="3.2" height="3.2"/><rect x="390.8" y="106" width="3.2" height="3.2"/><rect x="394" y="106" width="3.2" height="3.2"/><rect x="397.2" y="106" width="3.2" height="3.2"/><rect x="400.4" y="106" width="3.2" height="3.2"/><rect x="403.6" y="106" width="3.2" height="3.2"/><rect x="406.8" y="106" width="3.2" height="3.2"/><rect x="381.2" y="109.2" width="3.2" height="3.2"/><rect x="384.4" y="109.2" width="3.2" height="3.2"/><rect x="390.8" y="109.2" width="3.2" height="3.2"/><rect x="394" y="109.2" width="3.2" height="3.2"/><rect x="397.2" y="109.2" width="3.2" height="3.2"/><rect x="403.6" y="109.2" width="3.2" height="3.2"/><rect x="406.8" y="109.2" width="3.2" height="3.2"/><rect x="378" y="112.4" width="3.2" height="3.2"/><rect x="381.2" y="112.4" width="3.2" height="3.2"/><rect x="384.4" y="112.4" width="3.2" height="3.2"/><rect x="387.6" y="112.4" width="3.2" height="3.2"/><rect x="390.8" y="112.4" width="3.2" height="3.2"/><rect x="394" y="112.4" width="3.2" height="3.2"/><rect x="397.2" y="112.4" width="3.2" height="3.2"/><rect x="400.4" y="112.4" width="3.2" height="3.2"/><rect x="403.6" y="112.4" width="3.2" height="3.2"/><rect x="406.8" y="112.4" width="3.2" height="3.2"/><rect x="410" y="112.4" width="3.2" height="3.2"/><rect x="381.2" y="115.6" width="3.2" height="3.2"/><rect x="384.4" y="115.6" width="3.2" height="3.2"/><rect x="387.6" y="115.6" width="3.2" height="3.2"/><rect x="390.8" y="115.6" width="3.2" height="3.2"/><rect x="394" y="115.6" width="3.2" height="3.2"/><rect x="397.2" y="115.6" width="3.2" height="3.2"/><rect x="400.4" y="115.6" width="3.2" height="3.2"/><rect x="403.6" y="115.6" width="3.2" height="3.2"/><rect x="406.8" y="115.6" width="3.2" height="3.2"/><rect x="381.2" y="118.8" width="3.2" height="3.2"/><rect x="387.6" y="118.8" width="3.2" height="3.2"/><rect x="400.4" y="118.8" width="3.2" height="3.2"/><rect x="406.8" y="118.8" width="3.2" height="3.2"/></g>
<text x="425.2" y="124" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Claude Code: the harness</text>
<text x="378" y="157" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">sends the whole conversation, every turn:</text>
<text x="378" y="181.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">instructions, tool list, your messages,</text>
<text x="378" y="205.6" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">earlier tool results</text>
<text x="378" y="229.9" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">first turn: ~22 000 tokens</text>
<rect x="360" y="380" width="440" height="180" rx="16" fill="#eef4fb" stroke="#7b9cc4" stroke-width="2"/>
<text x="378" y="414" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Runs the tools on your files</text>
<text x="378" y="447" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">Bash  Read  Edit  Write  …</text>
<text x="378" y="471.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">the model only writes text;</text>
<text x="378" y="495.6" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">Claude Code does the acting,</text>
<text x="378" y="519.9" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">with your permission</text>
<path d="M540,290 L540,380" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="528" y="342" font-size="17" font-weight="400" fill="#52606d" text-anchor="end" xml:space="preserve" font-style="italic">tool call</text>
<path d="M620,380 L620,290" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="632" y="342" font-size="17" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve" font-style="italic">result</text>
<rect x="940" y="60" width="610" height="510" rx="16" fill="#f3eefb" stroke="#9b85c9" stroke-width="2"/>
<text x="962" y="96" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Model server: LM Studio, or llama-server</text>
<text x="962" y="124" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">port 1234 (LM Studio) or 8080 (llama-server)</text>
<path d="M800,165 L940,165" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="870" y="153" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle" xml:space="preserve" font-style="italic">request</text>
<path d="M940,240 L800,240" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="870" y="268" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle" xml:space="preserve" font-style="italic">reply:</text>
<text x="870" y="290" font-size="17" font-weight="400" fill="#52606d" text-anchor="middle" xml:space="preserve" font-style="italic">text or tool call</text>
<rect x="965" y="140" width="560" height="110" rx="16" fill="#f1f7ee" stroke="#8fb67f" stroke-width="2"/>
<text x="983" y="174" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Chat template</text>
<text x="983" y="207" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">messages → one string with markers:</text>
<text x="983" y="231.3" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">&lt;|im_start|&gt;user …&lt;|im_end|&gt;</text>
<path d="M1245,250 L1245,275" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="965" y="275" width="560" height="140" rx="16" fill="#f1f7ee" stroke="#8fb67f" stroke-width="2"/>
<text x="983" y="309" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Inference engine: llama.cpp</text>
<text x="983" y="342" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">prefill: reads the whole prompt at once</text>
<text x="983" y="366.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">decode: writes one token at a time,</text>
<text x="983" y="390.6" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">each one reads all the weights again</text>
<path d="M1245,415 L1245,440" fill="none" stroke="#52606d" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="965" y="440" width="560" height="110" rx="16" fill="#f1f7ee" stroke="#8fb67f" stroke-width="2"/>
<text x="983" y="474" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Weights + KV cache, in RAM</text>
<text x="983" y="507" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">Qwen3.5-9B-Q4_K_M.gguf  5.7 GB</text>
<text x="983" y="531.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">KV cache: the context, 32 KiB per token</text>
<rect x="30" y="620" width="760" height="150" rx="16" fill="#f4f5f7" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="48" y="654" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">Optional: LiteLLM, a translator</text>
<text x="48" y="687" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">converts Anthropic's API format (Claude Code)</text>
<text x="48" y="711.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">to OpenAI's, for servers that speak only that;</text>
<text x="48" y="735.6" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">LM Studio and llama-server speak both</text>
<rect x="810" y="620" width="760" height="150" rx="16" fill="#fdf3ea" stroke="#e0a36f" stroke-width="2"/>
<text x="828" y="654" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" xml:space="preserve">In the cloud: the same chain, far away</text>
<text x="828" y="687" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">by default, Claude Code sends the same request</text>
<text x="828" y="711.3" font-size="18" font-weight="400" fill="#52606d" text-anchor="start" xml:space="preserve">to api.anthropic.com; this variable changes the address:</text>
<text x="828" y="735.6" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">ANTHROPIC_BASE_URL=http://localhost:1234</text>
</svg>
