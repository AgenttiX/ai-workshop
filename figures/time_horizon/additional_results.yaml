# Time horizons that are not (yet) in METR's benchmark_results_1_1.yaml.
# The format follows benchmark_results_1_1.yaml: the horizon lengths are in minutes.
results:
  gpt_5_6_sol:
    name: GPT-5.6 Sol
    benchmark_name: METR-Horizon-v1.1
    metrics:
      p50_horizon_length:
        # "If we follow our standard methodology of marking cheating attempts as failures, we arrive at a
