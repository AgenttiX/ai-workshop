        ci_high: 2400.0
        ci_low: 300.0
        estimate: 678.0
    # Limited preview to trusted partners, analogous to METR's date for Claude Mythos Preview (early).
    # The public release was on 2026-07-09.
    release_date: 2026-06-26
    robust: false
    source: https://metr.org/blog/2026-06-26-gpt-5-6-sol/
