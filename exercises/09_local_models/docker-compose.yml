# llama.cpp server with a GGUF model from models/model.gguf.
# For GPU acceleration, pick the image variant for your hardware
# (see https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md).
# You can find template configurations for various hardware here:
# https://github.com/AgenttiX/agx-ai

services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp
    command: [
      # Change this according to the file name of the downloaded model
      "--model", "/models/model.gguf",
      "--gpu-layers", "all",
      "--host", "0.0.0.0",
      "--port", "8080",
      # Without this, the server reserves memory for the model's maximum context (262 144 tokens for Qwen3.5).
      "--ctx-size", "32768",
      # Qwen3.5's own template stops with an error when Claude Code sends a second system message.
      "--chat-template-file", "/templates/qwen35-claude-code.jinja",
      # Thinking tokens are written at the same slow speed as the answer.
      "--chat-template-kwargs", "{\"enable_thinking\": false}"
    ]
    ports:
      - "8080:8080"
    volumes:
      # Change the first path to the path of the downloaded model
      - ./models:/models
      # For use with Claude Code
      - ./qwen35-claude-code.jinja:/templates/qwen35-claude-code.jinja:ro
